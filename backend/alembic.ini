[alembic]
# Ruta absoluta relativa a este archivo: funciona desde backend/ y desde /app.
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# La URL real la resuelve migrations/env.py (-x url=... o ALEMBIC_DATABASE_URL).
# Este placeholder no se usa.
sqlalchemy.url = postgresql+psycopg://combina2:combina2@localhost:5432/combina2

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
