[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combina2-backend"
version = "0.1.0"
description = "Combina2 backend: FastAPI + TensorFlow. Fase 6: redes E/G/C, eval, calibracion y versionado."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "pillow>=12.3.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
ml = [
    # Inferencia neuronal (redes E/G/C, fases 3-4). Opcional en el runtime
    # local sin TF: services/inference.py importa TF de forma perezosa y usa
    # el motor clasico (fallback) si no esta instalado o no hay .keras activo.
    # El Docker de produccion SI instala este extra (Python 3.12), con las
    # mismas versiones que los .keras del manifiesto.
    "tensorflow-cpu==2.21.0",
    "keras==3.15.1",
]

[tool.setuptools.packages.find]
# Solo se empaqueta la app FastAPI. `eval/`, `scripts/`, `models/` y `tests/`
# viven en el repo pero no son paquetes de distribucion (evita el error de
# "Multiple top-level packages discovered" en flat-layout).
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
