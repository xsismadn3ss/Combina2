name: CI

on:
  push:
    # Cualquier rama (incluida 22-combina2) para que el CI corra antes del PR.
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-runtime:
    name: Backend runtime (Python 3.14, sin TF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar runtime
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Tests (modelos NN hacen skip sin TF)
        working-directory: backend
        run: python -m pytest tests -q

  backend-ml:
    name: Backend ML (Python 3.12, TF 2.21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ml.txt
      - name: Instalar entorno ML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-ml.txt
      - name: Tests completos
        working-directory: backend
        run: python -m pytest tests -q
      - name: Eval E/G/C (gates + manifiesto)
        working-directory: backend
        run: |
          python -m eval.run_eval --strict --check-manifest \
            --json eval-report.json --md eval-report.md
      - name: Publicar resumen
        if: always()
        run: |
          if [ -f backend/eval-report.md ]; then
            cat backend/eval-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            backend/eval-report.json
            backend/eval-report.md
          if-no-files-found: warn

  web:
    name: Web (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
